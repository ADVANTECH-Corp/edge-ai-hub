services:
  vlm-assistant:
    container_name: vlm-assistant
    image: advigw/vlm-assistant:dev
    restart: unless-stopped
    network_mode: host
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
    volumes:
      - /opt/Advantech/EdgeAI/EdgeAIHub/edge-ai-hub/AI_Case/Industrial/VLM-Assistant:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
  ollama:
    container_name: ollama
    image: ollama/ollama:0.23.0
    runtime: nvidia
    stdin_open: true
    tty: true
    restart: unless-stopped
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_MODELS=/root/.ollama
      - OLLAMA_HOST=0.0.0.0:${OLLAMA_PORT:-23951}
      - OLLAMA_LOGS=/root/.ollama/ollama.log
      - HF_HUB_CACHE=/root/.cache/huggingface
    volumes:
      - /opt/Advantech/EdgeAI/System/Nvidia_Jetson/GenAI/app/engine/ollama/ollama:/root/.ollama
      - /opt/Advantech/EdgeAI/System/Nvidia_Jetson/GenAI/app/engine/ollama/cache:/root/.cache
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 60s
      retries: 45
      start_period: 15s

  ollama-init:
    image: curlimages/curl:latest
    network_mode: host
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "curl -s http://127.0.0.1:${OLLAMA_PORT:-23951}/api/generate
      -d '{\"model\":\"${DEFAULT_MODELS:-gemma4:e4b-it-q4_K_M}\",\"prompt\":\"hi\",\"stream\":false,\"keep_alive\":-1}'"

volumes:
  vlm-assistant: {}